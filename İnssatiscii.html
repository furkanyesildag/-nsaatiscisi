<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>İnşaat Yılanı</title>
<meta property="og:title" content="İnşaat Yılanı">
<meta property="og:description" content="Malzemeleri topla, şantiyeni kat kat yükselt. Skor tablosunda kim önde?">
<meta name="description" content="Malzemeleri topla, şantiyeni kat kat yükselt.">
<meta name="theme-color" content="#16181d">
<style>
  :root{
    --asfalt:#16181d; --asfalt2:#0e1014; --sari:#ffc400; --sari2:#ffe07a;
    --turuncu:#ff6b2c; --beton:#8e96a3; --yesil:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overscroll-behavior:none;}
  html{touch-action:none;}
  body{
    background:var(--asfalt2);color:#fff;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    touch-action:none;user-select:none;overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .serit{height:9px;flex:none;background:repeating-linear-gradient(45deg,var(--sari) 0 14px,#111 14px 28px);}

  #hud{flex:none;display:flex;align-items:flex-end;gap:14px;padding:9px 14px 7px;background:var(--asfalt);}
  .stat{display:flex;flex-direction:column;line-height:1;}
  .k{font-size:9px;letter-spacing:.18em;color:var(--beton);font-weight:800;margin-bottom:4px;}
  .v{font-size:22px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  #skorV{color:var(--sari);} #binaV{color:var(--turuncu);} #rekorV{color:var(--beton);font-size:18px;}
  .araclar{margin-left:auto;display:flex;gap:8px;}
  .araclar button{background:#22252c;border:1px solid #363a44;color:var(--sari);width:44px;height:44px;border-radius:12px;font-size:15px;font-weight:900;}
  .araclar button:active{background:var(--sari);color:#111;}
  #ses{color:#fff;font-size:16px;}

  #siluet{flex:none;height:24px;display:flex;align-items:flex-end;gap:3px;padding:0 14px 5px;background:var(--asfalt);overflow:hidden;}
  #siluet i{display:block;width:9px;background:linear-gradient(180deg,var(--turuncu),#7a2f10);border-top:2px solid var(--sari);border-radius:1px;}
  #siluetBos{font-size:9px;letter-spacing:.18em;color:#444a55;font-weight:800;}

  #saha{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:var(--asfalt2);min-height:0;touch-action:none;overscroll-behavior:none;}
  canvas{display:block;border:3px solid var(--sari);border-radius:4px;}

  #kaplama{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(10,11,14,.93);padding:18px;overflow-y:auto;}
  #kaplama.gizli{display:none;}
  .baslik{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:.95;}
  .baslik span{color:var(--sari);display:block;font-size:.55em;letter-spacing:.02em;margin-top:8px;}
  .alt{font-size:12.5px;color:var(--beton);max-width:290px;line-height:1.5;}
  .btn{background:var(--sari);color:#111;border:none;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:900;letter-spacing:.08em;box-shadow:0 5px 0 #b88c00;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b88c00;}
  .btn.wa{background:var(--yesil);color:#08240f;box-shadow:0 5px 0 #17944a;}
  .btn.wa:active{box-shadow:0 2px 0 #17944a;}
  .mod{display:flex;gap:8px;}
  .mod button{background:#22252c;border:1px solid #32363f;color:var(--beton);padding:9px 14px;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.06em;}
  .mod button.aktif{background:#2f2410;border-color:var(--sari);color:var(--sari);}
  .rapor{display:flex;gap:22px;justify-content:center;}
  .rapor div{display:flex;flex-direction:column;gap:5px;}
  .rapor b{font-size:24px;color:var(--sari);font-variant-numeric:tabular-nums;}
  .yeniRekor{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--turuncu);}

  input.isim{
    background:#22252c;border:1px solid #363a44;border-radius:11px;color:#fff;
    padding:12px 14px;font-size:15px;font-weight:800;width:210px;text-align:center;
    user-select:text;-webkit-user-select:text;touch-action:auto;
  }
  input.isim:focus{outline:none;border-color:var(--sari);}

  .tablo{width:min(300px,100%);background:#191c22;border:1px solid #2a2e37;border-radius:13px;overflow:hidden;}
  .tablo h4{font-size:9.5px;letter-spacing:.18em;color:var(--beton);font-weight:800;padding:9px 12px;background:#20242c;text-align:left;}
  .tablo ol{list-style:none;}
  .tablo li{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:13px;border-top:1px solid #23272f;}
  .tablo li .s{width:16px;color:#565d6a;font-weight:900;font-size:11px;font-variant-numeric:tabular-nums;}
  .tablo li .a{flex:1;text-align:left;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tablo li .p{font-weight:900;color:var(--sari);font-variant-numeric:tabular-nums;}
  .tablo li.ben{background:#2a2210;}
  .tablo li.ben .a{color:var(--sari2);}
  .tablo .bos{padding:14px 12px;font-size:12px;color:#565d6a;}
  .paylasKutu{
    width:min(300px,100%);background:#191c22;border:1px dashed #3a3f4a;border-radius:11px;
    padding:11px;font-size:11.5px;color:var(--beton);line-height:1.5;
    user-select:text;-webkit-user-select:text;word-break:break-all;text-align:left;
  }

  #pad{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--asfalt);display:flex;justify-content:center;}
  .dpad{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(2,52px);gap:9px;}
  .dpad button{background:#22252c;border:1px solid #363a44;border-radius:13px;color:var(--sari);font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .dpad button:active{background:var(--sari);color:#111;}
  #yukari{grid-area:1/2} #sol{grid-area:2/1} #asagi{grid-area:2/2} #sag{grid-area:2/3}
  .ipucu{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:#454b56;letter-spacing:.1em;font-weight:700;}
</style>
</head>
<body>

<div class="serit"></div>

<header id="hud">
  <div class="stat"><span class="k">SKOR</span><span class="v" id="skorV">0</span></div>
  <div class="stat"><span class="k">KAT</span><span class="v" id="binaV">0</span></div>
  <div class="stat"><span class="k">REKOR</span><span class="v" id="rekorV">0</span></div>
  <div class="araclar">
    <button id="ses" aria-label="Ses">🔊</button>
    <button id="duraklat" aria-label="Mola">II</button>
  </div>
</header>

<div id="siluet"><span id="siluetBos">ŞANTİYE BOŞ</span></div>

<div id="saha">
  <canvas id="cv"></canvas>
  <div id="kaplama"></div>
  <div class="ipucu">PARMAĞINI KAYDIR YA DA TUŞLARI KULLAN</div>
</div>

<div id="pad">
  <div class="dpad">
    <button id="yukari">▲</button>
    <button id="sol">◀</button>
    <button id="asagi">▼</button>
    <button id="sag">▶</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref as dbRef, get as dbGet, set as dbSet } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const COLS=15, ROWS=19;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
const kaplama=document.getElementById('kaplama');
const skorV=document.getElementById('skorV'), binaV=document.getElementById('binaV'), rekorV=document.getElementById('rekorV');
const siluet=document.getElementById('siluet');

const MALZEME=[{e:'🧱',p:10},{e:'🪵',p:10},{e:'🔩',p:10},{e:'🪛',p:10},{e:'🚜',p:15},{e:'🛠️',p:15}];
const VINC={e:'🏗️',p:50};

let hucre=20, dpr=1, durum='hazir', zorluk='kolay';
let yilan, yon, sonYon, kuyruk, yem, altin, engeller, skor, kat, malzeme, hiz, birikim, onceki, rekor=0, buyudu=false;
let parcaciklar=[], yazilar=[], sesAcik=true, ac=null;
let isim='', tablo=[], tabloDurum='yukleniyor';
const zemin=document.createElement('canvas'), zctx=zemin.getContext('2d');
const cache={};

/* --- depo: firebase (ortak) / tarayici (kisisel) / bellek --- */
const firebaseConfig = {
  apiKey: "AIzaSyA4aMDHcedJE3d_zkGoa8ZHDYTq4RGE0_Q",
  authDomain: "insaat-yilani.firebaseapp.com",
  databaseURL: "https://insaat-yilani-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "insaat-yilani",
  storageBucket: "insaat-yilani.firebasestorage.app",
  messagingSenderId: "477122952131",
  appId: "1:477122952131:web:5482fa8b18a49ce10a9b76"
};
let fbDb=null;
try{ fbDb=getDatabase(initializeApp(firebaseConfig)); }catch(e){}
if(fbDb){
  window.storage={
    get: async(anahtar,ortakMi)=>{
      if(!ortakMi){
        try{ return {value:localStorage.getItem(anahtar)}; }catch(e){ return {value:null}; }
      }
      try{
        const anlik=await dbGet(dbRef(fbDb,anahtar.replace(/:/g,'/')));
        return {value:anlik.exists()?anlik.val():null};
      }catch(e){ return {value:null}; }
    },
    set: async(anahtar,deger,ortakMi)=>{
      if(!ortakMi){
        try{ localStorage.setItem(anahtar,deger); }catch(e){}
        return;
      }
      try{ await dbSet(dbRef(fbDb,anahtar.replace(/:/g,'/')),deger); }catch(e){}
    }
  };
}
const ORTAK = !!(window.storage && window.storage.get);
const bellek = {};
async function oku(anahtar, ortakMi){
  if(ORTAK){
    try{ const r=await window.storage.get(anahtar,!!ortakMi); return r&&r.value?r.value:null; }catch(e){ return null; }
  }
  try{ const v=localStorage.getItem(anahtar); if(v!==null) return v; }catch(e){}
  return bellek[anahtar]||null;
}
async function yaz(anahtar, deger, ortakMi){
  if(ORTAK){
    try{ await window.storage.set(anahtar,deger,!!ortakMi); return; }catch(e){}
  }
  try{ localStorage.setItem(anahtar,deger); return; }catch(e){}
  bellek[anahtar]=deger;
}
const TABLO_ANAHTAR = ORTAK ? 'insaatYilani:tablo' : 'insaatYilani:tabloYerel';

async function rekorYukle(){
  const r=await oku('insaatYilani:rekor'); if(r) rekor=parseInt(r)||0;
  const i=await oku('insaatYilani:isim'); if(i) isim=i;
  rekorV.textContent=rekor;
}
async function rekorKaydet(){ await yaz('insaatYilani:rekor',String(rekor)); }
async function isimKaydet(){ await yaz('insaatYilani:isim',isim); }
async function tabloOku(){
  const v=await oku(TABLO_ANAHTAR,ORTAK);
  try{ tablo=v?(JSON.parse(v)||[]):[]; }catch(e){ tablo=[]; }
  tabloDurum='hazir';
  return tablo;
}
async function tabloYaz(kayit){
  await tabloOku();
  const i=tablo.findIndex(k=>(k.isim||'').toLowerCase()===kayit.isim.toLowerCase());
  if(i>=0){ if((tablo[i].skor||0)<kayit.skor) tablo[i]=kayit; }
  else tablo.push(kayit);
  tablo.sort((a,b)=>(b.skor||0)-(a.skor||0));
  tablo=tablo.slice(0,15);
  await yaz(TABLO_ANAHTAR,JSON.stringify(tablo),ORTAK);
  return tablo;
}
function tabloHtml(limit){
  const liste=tablo.slice(0,limit||8);
  const baslik = ORTAK ? 'ŞANTİYE ŞEFLERİ / ORTAK TABLO' : 'ŞANTİYE ŞEFLERİ / BU TELEFON';
  let ic;
  if(tabloDurum!=='hazir') ic='<div class="bos">Tablo yükleniyor</div>';
  else if(!liste.length) ic='<div class="bos">Henüz kimse ustalaşmadı. İlk sırayı sen aç.</div>';
  else ic='<ol>'+liste.map((k,i)=>
    '<li class="'+(k.isim===isim?'ben':'')+'"><span class="s">'+(i+1)+'</span>'+
    '<span class="a">'+kacir(k.isim)+'</span>'+
    '<span class="p">'+(k.skor||0)+'</span></li>').join('')+'</ol>';
  return '<div class="tablo"><h4>'+baslik+'</h4>'+ic+'</div>';
}
function kacir(s){ return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])).slice(0,18); }

/* --- paylasim --- */
function paylasMetni(){
  const web=(location.protocol==='http:'||location.protocol==='https:');
  const ek=web?('\n'+location.href):'\n(oyun dosyası bu sohbette, indirip tarayıcıda aç)';
  return 'İnşaat Yılanı: '+skor+' puan, '+kat+' kat diktim. Geçebilene aşk olsun.'+ek;
}
async function paylas(btn){
  const metin=paylasMetni();
  try{
    if(navigator.share){ await navigator.share({text:metin}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  try{
    const w=window.open('https://wa.me/?text='+encodeURIComponent(metin),'_blank');
    if(w) return;
  }catch(e){}
  const kutu=document.getElementById('paylasKutu');
  if(kutu){ kutu.style.display='block'; kutu.textContent=metin; }
}

/* --- olcu --- */
function olcule(){
  const saha=document.getElementById('saha');
  const w=saha.clientWidth-18, h=saha.clientHeight-18;
  hucre=Math.max(12,Math.floor(Math.min(w/COLS,h/ROWS)));
  dpr=Math.min(window.devicePixelRatio||1,1.5);
  cv.style.width=(hucre*COLS)+'px'; cv.style.height=(hucre*ROWS)+'px';
  cv.width=Math.round(hucre*COLS*dpr); cv.height=Math.round(hucre*ROWS*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineJoin='round'; ctx.lineCap='round';
  for(const k in cache) delete cache[k];
  zeminCiz();
}
function zeminCiz(){
  const W=hucre*COLS, H=hucre*ROWS;
  zemin.width=Math.round(W*dpr); zemin.height=Math.round(H*dpr);
  zctx.setTransform(dpr,0,0,dpr,0,0);
  zctx.fillStyle='#12151a'; zctx.fillRect(0,0,W,H);
  zctx.strokeStyle='rgba(43,108,176,.20)'; zctx.lineWidth=1;
  zctx.beginPath();
  for(let x=1;x<COLS;x++){ zctx.moveTo(x*hucre+.5,0); zctx.lineTo(x*hucre+.5,H); }
  for(let y=1;y<ROWS;y++){ zctx.moveTo(0,y*hucre+.5); zctx.lineTo(W,y*hucre+.5); }
  zctx.stroke();
}
function sim(e){
  if(cache[e]) return cache[e];
  const s=document.createElement('canvas');
  s.width=s.height=Math.round(hucre*dpr);
  const c=s.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.font=Math.round(hucre*.74)+'px serif'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(e,hucre/2,hucre*.55);
  cache[e]=s; return s;
}
let olcuBek=null;
window.addEventListener('resize',()=>{ clearTimeout(olcuBek); olcuBek=setTimeout(olcule,120); },{passive:true});

/* --- ses --- */
function bip(f,sure,tip){
  if(!sesAcik) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=tip||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(.05,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+sure);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+sure);
  }catch(e){}
}

/* --- oyun --- */
function bosHucre(){
  for(let d=0;d<300;d++){
    const p={x:(Math.random()*COLS)|0,y:(Math.random()*ROWS)|0};
    if(yilan.some(s=>s.x===p.x&&s.y===p.y)) continue;
    if(engeller.some(s=>s.x===p.x&&s.y===p.y)) continue;
    if(yem&&yem.x===p.x&&yem.y===p.y) continue;
    if(altin&&altin.x===p.x&&altin.y===p.y) continue;
    if(Math.abs(p.x-yilan[0].x)+Math.abs(p.y-yilan[0].y)<3) continue;
    return p;
  }
  return null;
}
function yemKoy(){
  const m=MALZEME[(Math.random()*MALZEME.length)|0];
  const p=bosHucre(); if(p) yem={x:p.x,y:p.y,e:m.e,p:m.p};
}
function basla(){
  yilan=[{x:7,y:12},{x:7,y:13},{x:7,y:14}];
  yon={x:0,y:-1}; sonYon={x:0,y:-1}; kuyruk=[];
  engeller=[]; altin=null; yem=null; buyudu=false;
  skor=0; kat=0; malzeme=0; hiz=190; birikim=0; onceki=performance.now();
  parcaciklar=[]; yazilar=[];
  yemKoy(); hudGuncelle(); siluetCiz();
  durum='oynanir'; kaplama.classList.add('gizli');
  bip(440,.08);
}
function adim(){
  if(kuyruk.length) yon=kuyruk.shift();
  sonYon=yon;
  let bas={x:yilan[0].x+yon.x, y:yilan[0].y+yon.y};
  if(zorluk==='kolay'){ bas.x=(bas.x+COLS)%COLS; bas.y=(bas.y+ROWS)%ROWS; }
  else if(bas.x<0||bas.y<0||bas.x>=COLS||bas.y>=ROWS) return bitir('saha çitine çarptın');
  if(engeller.some(o=>o.x===bas.x&&o.y===bas.y)) return bitir('bariyere çarptın');
  if(yilan.some((s,i)=>i<yilan.length-1&&s.x===bas.x&&s.y===bas.y)) return bitir('kendi ekibini ezdin');

  yilan.unshift(bas); buyudu=false;

  if(altin&&altin.x===bas.x&&altin.y===bas.y){
    skor+=VINC.p; yazi(bas,'+'+VINC.p); patlat(bas,'#ffc400'); altin=null; buyudu=true;
    bip(880,.12); bip(1320,.14);
  }
  if(yem&&yem.x===bas.x&&yem.y===bas.y){
    skor+=yem.p; yazi(bas,'+'+yem.p); patlat(bas,'#ff6b2c');
    malzeme++; buyudu=true; bip(660,.07);
    yem=null; yemKoy();
    hiz=Math.max(95,hiz-5);
    if(malzeme%5===0){ kat++; siluetCiz(); bip(520,.1); bip(780,.16); }
    if(malzeme%4===0){ const p=bosHucre(); if(p&&engeller.length<26) engeller.push(p); }
    if(malzeme%6===0&&!altin){ const p=bosHucre(); if(p) altin={x:p.x,y:p.y,son:performance.now()+7000}; }
  }
  if(!buyudu) yilan.pop();
  hudGuncelle();
}
function yazi(p,t){ yazilar.push({x:p.x,y:p.y,t:t,o:1}); }
function patlat(p,renk){
  for(let i=0;i<8;i++) parcaciklar.push({x:(p.x+.5)*hucre,y:(p.y+.5)*hucre,vx:(Math.random()-.5)*3.2,vy:(Math.random()-.5)*3.2,o:1,c:renk});
}
function bitirEkran(sebep,yeni){
  kaplama.innerHTML='<div class="baslik">PAYDOS<span>'+sebep+'</span></div>'+
    '<div class="rapor"><div><span class="k">SKOR</span><b>'+skor+'</b></div>'+
    '<div><span class="k">KAT</span><b>'+kat+'</b></div>'+
    '<div><span class="k">MALZEME</span><b>'+malzeme+'</b></div></div>'+
    (yeni?'<div class="yeniRekor">YENİ REKOR</div>':'')+
    tabloHtml(6)+
    '<button class="btn" id="tekrar">YENİDEN BAŞLA</button>'+
    '<button class="btn wa" id="paylasBtn">ARKADAŞINA MEYDAN OKU</button>'+
    '<div class="paylasKutu" id="paylasKutu" style="display:none"></div>';
  document.getElementById('tekrar').onclick=basla;
  document.getElementById('paylasBtn').onclick=paylas;
}
function bitir(sebep){
  durum='bitti'; bip(200,.2,'sawtooth');
  const yeni=skor>rekor;
  if(yeni){ rekor=skor; rekorKaydet(); rekorV.textContent=rekor; }
  kaplama.classList.remove('gizli');
  bitirEkran(sebep,yeni);
  if(isim&&skor>0){
    tabloYaz({isim:isim,skor:skor,kat:kat,t:Date.now()}).then(()=>{
      if(durum==='bitti') bitirEkran(sebep,yeni);
    });
  }
}

/* --- cizim --- */
function mrk(c){ return (c+.5)*hucre; }
function ciz(t){
  const W=hucre*COLS, H=hucre*ROWS;
  ctx.drawImage(zemin,0,0,W,H);
  if(!yilan) return;

  for(let i=0;i<engeller.length;i++){
    const o=engeller[i];
    ctx.fillStyle='rgba(224,80,60,.15)';
    ctx.fillRect(o.x*hucre+1,o.y*hucre+1,hucre-2,hucre-2);
    ctx.drawImage(sim('🚧'),o.x*hucre,o.y*hucre,hucre,hucre);
  }
  if(yem) ctx.drawImage(sim(yem.e),yem.x*hucre,yem.y*hucre,hucre,hucre);
  if(altin){
    const kalan=altin.son-performance.now();
    if(kalan>1600||((performance.now()/170)|0)%2===0){
      ctx.beginPath(); ctx.fillStyle='rgba(255,224,122,.20)';
      ctx.arc(mrk(altin.x),mrk(altin.y),hucre*.5,0,6.283); ctx.fill();
      ctx.drawImage(sim(VINC.e),altin.x*hucre,altin.y*hucre,hucre,hucre);
    }
  }

  const n=yilan.length, noktalar=[];
  const hx=mrk(yilan[0].x)-(1-t)*sonYon.x*hucre;
  const hy=mrk(yilan[0].y)-(1-t)*sonYon.y*hucre;
  noktalar.push({x:hx,y:hy});
  for(let i=1;i<n;i++) noktalar.push({x:mrk(yilan[i].x),y:mrk(yilan[i].y)});
  if(!buyudu&&n>=2){
    const s=yilan[n-1], o=yilan[n-2];
    let dx=o.x-s.x, dy=o.y-s.y;
    if(Math.abs(dx)>1) dx=-Math.sign(dx);
    if(Math.abs(dy)>1) dy=-Math.sign(dy);
    noktalar[n-1]={x:mrk(s.x)+dx*hucre*t, y:mrk(s.y)+dy*hucre*t};
  }

  const kalinlik=hucre*.82, esik=hucre*1.6;
  const parcalar=[[noktalar[0]]];
  for(let i=1;i<noktalar.length;i++){
    const a=noktalar[i-1], b=noktalar[i];
    if(Math.abs(a.x-b.x)>esik||Math.abs(a.y-b.y)>esik) parcalar.push([b]);
    else parcalar[parcalar.length-1].push(b);
  }
  ctx.setLineDash([]); ctx.lineWidth=kalinlik; ctx.strokeStyle='#ffc400';
  for(const p of parcalar){
    ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++) ctx.lineTo(p[i].x,p[i].y);
    if(p.length===1) ctx.lineTo(p[0].x,p[0].y);
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(24,24,26,.38)'; ctx.lineWidth=kalinlik*.9;
  ctx.setLineDash([hucre*.20,hucre*.36]); ctx.lineDashOffset=-t*hucre;
  for(const p of parcalar){
    if(p.length<2) continue;
    ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++) ctx.lineTo(p[i].x,p[i].y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.beginPath(); ctx.fillStyle='#ffe07a';
  ctx.arc(hx,hy,kalinlik*.56,0,6.283); ctx.fill();
  const g=hucre*.13, ax=sonYon.x!==0?0:hucre*.20, ay=sonYon.x!==0?hucre*.20:0;
  const ox=sonYon.x*hucre*.14, oy=sonYon.y*hucre*.14;
  ctx.fillStyle='#16181d';
  ctx.beginPath(); ctx.arc(hx+ox-ax,hy+oy-ay,g,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(hx+ox+ax,hy+oy+ay,g,0,6.283); ctx.fill();

  for(let i=0;i<parcaciklar.length;i++){
    const p=parcaciklar[i];
    ctx.globalAlpha=p.o<0?0:p.o; ctx.fillStyle=p.c;
    ctx.fillRect(p.x-2.5,p.y-2.5,5,5);
  }
  ctx.globalAlpha=1;
  if(yazilar.length){
    ctx.font='900 '+Math.round(hucre*.42)+'px ui-sans-serif,system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const y of yazilar){
      ctx.globalAlpha=y.o<0?0:y.o; ctx.fillStyle='#ffe07a';
      ctx.fillText(y.t,mrk(y.x),mrk(y.y)-(1-y.o)*24);
    }
    ctx.globalAlpha=1;
  }
}

}

/* --- dongu --- */
function dongu(z){
  requestAnimationFrame(dongu);
  let dt=z-onceki; onceki=z;
  if(dt>120) dt=120;
  for(let i=0;i<parcaciklar.length;i++){ const p=parcaciklar[i]; p.x+=p.vx; p.y+=p.vy; p.o-=.04; }
  if(parcaciklar.length) parcaciklar=parcaciklar.filter(p=>p.o>0);
  if(yazilar.length){ for(const y of yazilar) y.o-=.02; yazilar=yazilar.filter(y=>y.o>0); }
  if(durum==='oynanir'){
    if(altin&&z>altin.son) altin=null;
    birikim+=dt;
    while(birikim>=hiz&&durum==='oynanir'){ birikim-=hiz; adim(); }
  }
  ciz(durum==='oynanir'?Math.min(1,birikim/hiz):1);
}

/* --- kontrol --- */
function cevir(nx,ny){
  if(durum!=='oynanir') return;
  const son=kuyruk.length?kuyruk[kuyruk.length-1]:yon;
  if(son.x===-nx&&son.y===-ny) return;
  if(son.x===nx&&son.y===ny) return;
  if(kuyruk.length<2){
    kuyruk.push({x:nx,y:ny});
    if(kuyruk.length===1&&birikim>hiz*.12) birikim=hiz;
  }
}
function tus(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});
  el.addEventListener('click',fn);
}
tus('yukari',()=>cevir(0,-1));

}
addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
  const k=e.key;
  if(k==='ArrowUp'||k==='w')cevir(0,-1);
  else if(k==='ArrowDown'||k==='s')cevir(0,1);
  else if(k==='ArrowLeft'||k==='a')cevir(-1,0);
  else if(k==='ArrowRight'||k==='d')cevir(1,0);
  else if(k===' '){e.preventDefault(); (durum==='hazir'||durum==='bitti')?basla():duraklat();}
});

let tLx=0, tLy=0, tAktif=false, tYonVar=false;
const ESIK_ILK=11, ESIK_DEVAM=19;
const saha=document.getElementById('saha');
saha.addEventListener('touchstart',e=>{
  if(!e.touches.length) return;
  tAktif=true; tYonVar=false;
  tLx=e.touches[0].clientX; tLy=e.touches[0].clientY;
},{passive:true});
saha.addEventListener('touchmove',e=>{
  if(!tAktif||!e.touches.length) return;
  e.preventDefault();
  const t=e.touches[0];
  const dx=t.clientX-tLx, dy=t.clientY-tLy;
  const esik=tYonVar?ESIK_DEVAM:ESIK_ILK;
  if(Math.abs(dx)<esik&&Math.abs(dy)<esik) return;
  if(Math.abs(dx)>Math.abs(dy)) cevir(dx>0?1:-1,0); else cevir(0,dy>0?1:-1);
  tLx=t.clientX; tLy=t.clientY; tYonVar=true;
},{passive:false});
saha.addEventListener('touchend',()=>{ tAktif=false; },{passive:true});
saha.addEventListener('touchcancel',()=>{ tAktif=false; },{passive:true});
